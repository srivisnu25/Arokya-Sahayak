<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor-Patient Chat | Dermastreak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-sm p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-800">Dermastreak Chat</h1>
    <button onclick="logout()" class="text-red-500 font-semibold">Logout</button>
  </header>

  <!-- Chat Window -->
  <main class="flex-grow flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-3xl bg-white rounded-lg shadow-md flex flex-col h-[500px]">
      <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <div class="p-4 flex space-x-2 border-t">
        <input type="text" id="messageInput" placeholder="Type your message..." class="flex-1 border rounded px-4 py-2">
        <button onclick="sendMessage()" class="px-4 py-2 bg-green-600 text-white rounded">Send</button>
      </div>
    </div>
  </main>

  <!-- Firebase Initialization -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBoScNEhiFNdljF9D_BK8aBGuJiJ9XpX8o",
      authDomain: "dermastreak-2caae.firebaseapp.com",
      projectId: "dermastreak-2caae",
      storageBucket: "dermastreak-2caae.appspot.com",
      messagingSenderId: "32726012100",
      appId: "1:32726012100:web:b5a2071c3ecea58810b991"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let chatId = null;

    // Logout
    function logout() {
      auth.signOut().then(() => {
        window.location.href = 'login.html';
      });
    }

    // Load Chat on Authentication
    auth.onAuthStateChanged(async user => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;

      // Get Doctor ID from URL (pass as ?doctorId=xxx)
      const urlParams = new URLSearchParams(window.location.search);
      const doctorId = urlParams.get('doctorId');

      if (!doctorId) {
        alert("Doctor not selected.");
        return;
      }

      // Generate Chat ID based on userId & doctorId (sorted to ensure uniqueness)
      chatId = [user.uid, doctorId].sort().join('_');

      listenForMessages();
    });

    // Listen for Messages in Firestore
    function listenForMessages() {
      db.collection('chats').doc(chatId).collection('messages')
        .orderBy('timestamp')
        .onSnapshot(snapshot => {
          const chatContainer = document.getElementById('chatMessages');
          chatContainer.innerHTML = '';
          snapshot.forEach(doc => {
            const msg = doc.data();
            const msgDiv = document.createElement('div');
            msgDiv.className = `p-2 rounded-lg ${msg.senderId === currentUser.uid ? 'bg-green-100 self-end' : 'bg-gray-200 self-start'} max-w-xs`;
            msgDiv.textContent = msg.text;
            chatContainer.appendChild(msgDiv);
          });
          chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    }

    // Send Message
    async function sendMessage() {
      const messageInput = document.getElementById('messageInput');
      const text = messageInput.value.trim();
      if (text === '') return;

      await db.collection('chats').doc(chatId).collection('messages').add({
        senderId: currentUser.uid,
        text: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      messageInput.value = '';
    }
  </script>
</body>
</html>
